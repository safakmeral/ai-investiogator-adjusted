</div>
<div class="flex items-center gap-3"><div class="flex flex-col items-end">

<main class="max-w-2xl mx-auto px-container-padding py-10">

<div class="mb-10 text-center">
<h1 class="font-headline-xl text-white uppercase mb-2">SORGU DEĞERLENDİRMESİ</h1>
<p class="text-on-surface-variant font-body-md opacity-80">Sorgu tamamlandı. Lütfen değerlendirmenizi yapın.</p>
</div>
<!-- Survey Section -->
<div class="space-y-4 custom-scrollbar">
<!-- Card 1 -->
<div class="bg-[#13131A] border border-[#2A2A3A] rounded-[12px] p-4 flex flex-col gap-4">
<label class="font-label-caps text-on-surface uppercase tracking-widest">Soruların kalitesini değerlendirin</label>
<div class="flex gap-2">
<span class="material-symbols-outlined text-[#F0A500]" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[#F0A500]" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[#F0A500]" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[#F0A500]" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>

</div>
</div>

</div>
</div>
<!-- Card 3 -->

<span class="material-symbols-outlined text-[#F0A500]" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>

<span class="material-symbols-outlined text-[#F0A500]" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>

</div>

                        SUÇSUZ
                    </button>
</div>
</div>

<div class="bg-[#13131A] border border-[#2A2A3A] rounded-[12px] p-4 flex flex-col gap-4">
<label class="font-label-caps text-on-surface uppercase tracking-widest">Ek notlar (isteğe bağlı)</label>
