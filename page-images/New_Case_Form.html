<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            background-color: #0A0A0F;
            color: #e2e1ed;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for clinical feel */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0A0A0F;
        }
        ::-webkit-scrollbar-thumb {
            background: #33343d;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "error": "#ffb4ab",
                      "secondary": "#c4c3e7",
                      "primary-container": "#6e88ff",
                      "on-secondary-fixed-variant": "#444461",
                      "on-primary-container": "#001d79",
                      "secondary-container": "#484966",
                      "primary-fixed": "#dde1ff",
                      "on-surface-variant": "#c4c5d7",
                      "tertiary-fixed": "#ffdbc8",
                      "on-primary": "#00228a",
                      "on-tertiary-container": "#481e00",
                      "surface-variant": "#33343d",
                      "outline-variant": "#444654",
                      "on-primary-fixed-variant": "#0034c0",
                      "tertiary-container": "#e1721e",
                      "surface-tint": "#b9c3ff",
                      "surface-container-lowest": "#0c0e15",
                      "on-tertiary-fixed": "#321300",
                      "surface-bright": "#383942",
                      "error-container": "#93000a",
                      "inverse-surface": "#e2e1ed",
                      "surface-dim": "#12131b",
                      "background": "#12131b",
                      "inverse-primary": "#2d50d9",
                      "on-background": "#e2e1ed",
                      "surface-container-low": "#1a1b23",
                      "tertiary-fixed-dim": "#ffb68a",
                      "secondary-fixed-dim": "#c4c3e7",
                      "on-tertiary": "#522300",
                      "primary": "#b9c3ff",
                      "on-secondary": "#2d2e4a",
                      "surface": "#12131b",
                      "on-error": "#690005",
                      "outline": "#8e90a0",
                      "surface-container": "#1e1f27",
                      "on-surface": "#e2e1ed",
                      "on-primary-fixed": "#001257",
                      "on-error-container": "#ffdad6",
                      "on-secondary-fixed": "#181933",
                      "tertiary": "#ffb68a",
                      "surface-container-highest": "#33343d",
                      "on-secondary-container": "#b9b9db",
                      "surface-container-high": "#282932",
                      "primary-fixed-dim": "#b9c3ff",
                      "on-tertiary-fixed-variant": "#743500",
                      "inverse-on-surface": "#2f3039",
                      "secondary-fixed": "#e1e0ff"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "data-gap": "8px",
                      "unit": "4px",
                      "gutter": "16px",
                      "container-padding": "24px"
              },
              "fontFamily": {
                      "headline-xl": ["Space Grotesk"],
                      "body-md": ["Inter"],
                      "data-mono": ["Space Grotesk"],
                      "label-caps": ["Space Grotesk"],
                      "headline-md": ["Space Grotesk"],
                      "body-lg": ["Inter"]
              },
              "fontSize": {
                      "headline-xl": ["24px", {"lineHeight": "120%", "letterSpacing": "0.15em", "fontWeight": "700"}],
                      "body-md": ["14px", {"lineHeight": "150%", "letterSpacing": "normal", "fontWeight": "400"}],
                      "data-mono": ["14px", {"lineHeight": "140%", "letterSpacing": "0.05em", "fontWeight": "500"}],
                      "label-caps": ["12px", {"lineHeight": "100%", "letterSpacing": "0.2em", "fontWeight": "600"}],
                      "headline-md": ["16px", {"lineHeight": "120%", "letterSpacing": "0.1em", "fontWeight": "600"}],
                      "body-lg": ["16px", {"lineHeight": "160%", "letterSpacing": "normal", "fontWeight": "400"}]
              }
            },
          },
        }
      </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-[#0A0A0F] min-h-screen flex flex-col font-body-md">
<!-- TopAppBar Shell -->
<header class="flex justify-between items-center w-full px-4 h-12 bg-slate-950 border-b border-slate-800 fixed top-0 z-50 relative">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-slate-500 cursor-pointer hover:bg-slate-900 p-1 transition-colors">chevron_left</span>
</div>
<h1 class="font-headline-md text-on-surface uppercase tracking-widest absolute left-1/2 -translate-x-1/2">YENİ VAKA</h1>
<div class="flex items-center absolute right-4 h-full">
<img alt="Officer Info" class="h-8 w-auto opacity-90" src="https://lh3.googleusercontent.com/aida/ADBb0ugxSDJlb7F_TG4HfYYwheyFVnVCS8E5HbnlUl0-k6nxfQ-UiAMCjf0xQZG8xrG5CUt9wqPaWpoZI7zsMxXMsAc7y3hxpkg7CixpwPUDI-PQT8fvCeDJH1FPfM0eP2G6ilPrjH-rGFTIUoZh7Hi-SCquvBAEH8aMxdMefzo6UqKYn2uHVo96fdS-pSRRnfKvf1tZ5LX12LEvbplF-P7i6NWbItl8A0n9C9OxtZ_CqjPPX7bOyZOXnnrQTHAuHjW2o6UWXqiHjzg8CDM"/>
</div></header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-12 overflow-y-auto px-container-padding py-8 max-w-2xl mx-auto w-full">
<form class="space-y-6">
<!-- Photo Upload Box -->
<div class="flex justify-center mb-8">
<div class="w-[120px] h-[120px] bg-[#13131A] border-2 border-dashed border-[#2A2A3A] rounded-lg flex flex-col items-center justify-center cursor-pointer hover:border-indigo-500 transition-colors">
<span class="material-symbols-outlined text-[#7A7A9A] mb-1">add_a_photo</span>
<span class="font-label-caps text-[10px] text-[#7A7A9A]">FOTOĞRAF EKLE</span>
</div>
</div>
<!-- Suspect Details Section -->
<div class="grid grid-cols-12 gap-4">
<div class="col-span-12">
<label class="block font-label-caps text-[10px] text-[#7A7A9A] uppercase mb-2">TC KİMLİK NO</label>
<input class="w-full bg-[#13131A] border border-[#2A2A3A] text-white rounded-lg px-4 py-3 focus:border-primary focus:ring-0 font-data-mono" placeholder="00000000000" type="text"/>
</div>
<div class="col-span-6">
<label class="block font-label-caps text-[10px] text-[#7A7A9A] uppercase mb-2">AD</label>
<input class="w-full bg-[#13131A] border border-[#2A2A3A] text-white rounded-lg px-4 py-3 focus:border-primary focus:ring-0" type="text"/>
</div>
<div class="col-span-6">
<label class="block font-label-caps text-[10px] text-[#7A7A9A] uppercase mb-2">SOYAD</label>
<input class="w-full bg-[#13131A] border border-[#2A2A3A] text-white rounded-lg px-4 py-3 focus:border-primary focus:ring-0" type="text"/>
</div>
<div class="col-span-4">
<label class="block font-label-caps text-[10px] text-[#7A7A9A] uppercase mb-2">YAŞ</label>
<input class="w-full bg-[#13131A] border border-[#2A2A3A] text-white rounded-lg px-4 py-3 focus:border-primary focus:ring-0 font-data-mono" type="number"/>
</div>
<div class="col-span-8">
<label class="block font-label-caps text-[10px] text-[#7A7A9A] uppercase mb-2">CİNSİYET</label>
<div class="flex gap-2">
<button class="flex-1 py-3 bg-[#4F6EF7] text-white font-label-caps rounded-lg" type="button">ERKEK</button>
<button class="flex-1 py-3 bg-[#13131A] border border-[#2A2A3A] text-[#7A7A9A] font-label-caps rounded-lg hover:border-indigo-400" type="button">KADIN</button>
</div>
</div>
</div>
<!-- Crime Selection -->
<div class="space-y-3">
<label class="block font-label-caps text-[10px] text-[#7A7A9A] uppercase">SUÇ TÜRÜ</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 bg-[#13131A] border border-[#2A2A3A] text-[10px] font-label-caps rounded-full text-[#7A7A9A] hover:bg-slate-900" type="button">CİNAYET</button>
<button class="px-4 py-2 bg-[#13131A] border border-[#2A2A3A] text-[10px] font-label-caps rounded-full text-[#7A7A9A] hover:bg-slate-900" type="button">HIRSIZLIK</button>
<button class="px-4 py-2 bg-[#13131A] border border-indigo-500 text-[10px] font-label-caps rounded-full text-indigo-400 bg-slate-900" type="button">DOLANDIRICILIK</button>
<button class="px-4 py-2 bg-[#13131A] border border-[#2A2A3A] text-[10px] font-label-caps rounded-full text-[#7A7A9A] hover:bg-slate-900" type="button">DİĞER</button>
</div>
<input class="w-full bg-[#13131A] border border-[#2A2A3A] text-white rounded-lg px-4 py-3 focus:border-primary focus:ring-0" placeholder="Suç detaylarını giriniz..." type="text"/>
</div>
<!-- Multi-line inputs -->
<div class="space-y-4">
<div>
<label class="block font-label-caps text-[10px] text-[#7A7A9A] uppercase mb-2">OLAY YERİ KANITLARI</label>
<textarea class="w-full bg-[#13131A] border border-[#2A2A3A] text-white rounded-lg px-4 py-3 focus:border-primary focus:ring-0 resize-none font-body-md text-sm" rows="4"></textarea>
</div>
<div>
<label class="block font-label-caps text-[10px] text-[#7A7A9A] uppercase mb-2">İLK İFADE</label>
<textarea class="w-full bg-[#13131A] border border-[#2A2A3A] text-white rounded-lg px-4 py-3 focus:border-primary focus:ring-0 resize-none font-body-md text-sm" rows="6"></textarea>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-[52px] bg-[#4F6EF7] text-white font-headline-md rounded-xl uppercase tracking-widest hover:brightness-110 active:scale-[0.98] transition-all shadow-lg shadow-indigo-500/20" type="button">
                SORGUYU BAŞLAT
            </button>
</form>
</main>
<!-- BottomNavBar Shell -->
</body></html>
